<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="DW Nirman Engineering logo">
  <defs>
    <linearGradient id="dwBlue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2a86e0"/><stop offset="1" stop-color="#16548f"/>
    </linearGradient>
    <linearGradient id="dwDark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#33414f"/><stop offset="1" stop-color="#232f3b"/>
    </linearGradient>
  </defs>

  <!-- Gear ring (open C) -->
  <path d="M 33 5.2 A 26 26 0 1 0 56 20" fill="none" stroke="url(#dwBlue)" stroke-width="4.2" stroke-linecap="round"/>
  <path d="M 44.44,54.40 L 46.79,58.81 L 50.52,56.48 L 47.58,52.44 Z M 53.71,46.20 L 57.80,49.07 L 60.07,45.30 L 55.61,43.03 Z M 58.24,34.69 L 63.19,35.38 L 63.50,31.00 L 58.50,31.00 Z M 57.06,22.37 L 61.78,20.74 L 60.07,16.70 L 55.61,18.97 Z M 50.41,11.94 L 53.88,8.34 L 50.52,5.52 L 47.58,9.56 Z M 39.75,5.66 L 41.21,0.88 L 36.93,-0.11 L 36.15,4.83 Z M 27.40,4.90 L 26.53,-0.02 L 22.27,1.04 L 23.81,5.80 Z M 16.05,9.84 L 13.04,5.84 L 9.73,8.73 L 13.26,12.26 Z M 8.18,19.38 L 3.69,17.19 L 2.04,21.27 L 6.80,22.81 Z M 5.50,31.46 L 0.50,31.55 L 0.89,35.93 L 5.83,35.15 Z M 8.60,43.44 L 4.19,45.79 L 6.52,49.52 L 10.56,46.58 Z" fill="url(#dwBlue)"/>

  <!-- Tall building (dark) -->
  <rect x="18.5" y="20" width="11.5" height="28" rx="1" fill="url(#dwDark)"/>
  <g fill="#f5f7fa" opacity="0.92">
    <rect x="20.8" y="23" width="2" height="2"/><rect x="25.4" y="23" width="2" height="2"/>
    <rect x="20.8" y="27" width="2" height="2"/><rect x="25.4" y="27" width="2" height="2"/>
    <rect x="20.8" y="31" width="2" height="2"/><rect x="25.4" y="31" width="2" height="2"/>
    <rect x="20.8" y="35" width="2" height="2"/><rect x="25.4" y="35" width="2" height="2"/>
    <rect x="20.8" y="39" width="2" height="2"/><rect x="25.4" y="39" width="2" height="2"/>
  </g>

  <!-- House with pitched roof (blue) -->
  <path d="M 29 48 V 38 L 38 31 L 47 38 V 48 Z" fill="#ffffff" stroke="#e2e8f0" stroke-width="0.5"/>
  <path d="M 27.6 39 L 38 30.6 L 48.4 39 L 46.7 40.9 L 38 33.8 L 29.3 40.9 Z" fill="url(#dwBlue)"/>
  <rect x="35.4" y="41" width="5" height="5" rx="0.4" fill="url(#dwDark)"/>

  <!-- Excavator arm (boom + stick + bucket), dark navy -->
  <g fill="none" stroke="url(#dwDark)" stroke-linecap="round" stroke-linejoin="round">
    <!-- boom: lower-right pivot up to elbow -->
    <path d="M 50 30 L 55.5 18.5" stroke-width="4.4"/>
    <!-- stick: elbow down toward the bucket over the house -->
    <path d="M 55.5 18.5 L 44.5 27" stroke-width="3.6"/>
    <!-- hydraulic cylinder detail -->
    <path d="M 51.5 24 L 47.5 21.5" stroke-width="1.6" opacity="0.85"/>
  </g>
  <!-- pivot base joint -->
  <circle cx="50" cy="30" r="2.4" fill="url(#dwDark)"/>
  <!-- toothed digger bucket -->
  <path d="M 44.8 26 L 48.6 28.4 Q 48.2 33.6 43 33 L 42.4 28.2 Z" fill="url(#dwDark)"/>
  <g fill="url(#dwDark)">
    <path d="M 43.1 32.7 l 0.7 1.7 0.7 -1.5 z"/>
    <path d="M 45.0 33.0 l 0.6 1.7 0.8 -1.4 z"/>
    <path d="M 46.7 32.7 l 0.5 1.6 0.9 -1.3 z"/>
  </g>

  <!-- Ground line -->
  <path d="M 13 51.5 Q 32 55.5 51 51.5" fill="none" stroke="url(#dwDark)" stroke-width="2" stroke-linecap="round"/>
</svg>
