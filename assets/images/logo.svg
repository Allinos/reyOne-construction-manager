      <rect x="22.4" y="28.5" width="2.2" height="2.2"/><rect x="27.4" y="28.5" width="2.2" height="2.2"/>
      <rect x="22.4" y="33" width="2.2" height="2.2"/><rect x="27.4" y="33" width="2.2" height="2.2"/>
      <rect x="22.4" y="37.5" width="2.2" height="2.2"/><rect x="27.4" y="37.5" width="2.2" height="2.2"/>
